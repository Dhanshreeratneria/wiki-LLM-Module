databases:
  - name: llm-wiki-db
    databaseName: llm_wiki
    user: wiki_user
    plan: basic-256mb

services:
  - type: web
    name: llm-wiki-mcp-all-tiers
    runtime: node
    rootDir: mcp-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-wiki-db
          property: connectionString
      - key: ACCESS_TIER
        value: all

  - type: web
    name: llm-wiki-mcp-tier2-3
    runtime: node
    rootDir: mcp-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-wiki-db
          property: connectionString
      - key: ACCESS_TIER
        value: tier2-3

  - type: web
    name: llm-wiki-mcp-tier3-only
    runtime: node
    rootDir: mcp-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-wiki-db
          property: connectionString
      - key: ACCESS_TIER
        value: tier3
